name: Claude

# Lets the repo owner ask Claude to act on a PR by mentioning @claude in a comment,
# review comment or review.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    # Only the owner can trigger it, so comments from anyone else never reach Claude.
    # Issue comments also fire for plain issues, so those are limited to PRs.
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'BBGMoura' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'BBGMoura' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'BBGMoura' &&
        contains(github.event.review.body, '@claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One run per PR at a time, so two comments can't push to the same branch at once.
    concurrency:
      group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that Claude's pushes trigger CI again.
      - name: Get Wonderbot app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WONDERBOT_APP_ID || secrets.WONDERBOT_APP_ID }}
          private-key: ${{ secrets.WONDERBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: booking-ui

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 50

      - name: Set git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${user_id}+${SLUG}[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --max-turns 100
            --append-system-prompt "You are acting on a review comment on a pull request. Read and follow this repo's CLAUDE.md. Push changes only to this PR's branch. Never merge, never force-push, never push to main, never close the PR. Run the repo's checks from CLAUDE.md and fix failures before you push. Keep the change to what the comment asks for. Reply on the PR, and end every reply with the line: Generated by Claude Code"
            --allowedTools "Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm ci),Bash(npm run lint),Bash(npm run format),Bash(npm run format:check),Bash(npm test:*),Bash(npm run build),Bash(npx jest:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(gh pr merge:*),Bash(gh pr close:*)"
